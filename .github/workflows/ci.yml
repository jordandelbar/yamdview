name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  hooks:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    env:
      FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
      TO: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c lefthook run pre-push
      - run: nix develop -c commitlint --from "$FROM" --to "$TO"
      - id: changes
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$HEAD_MESSAGE" == "chore: Release "* ]]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$FROM...$TO" | grep -qE '^(src/|Cargo\.(toml|lock)$|flake\.(nix|lock)$|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
  test:
    needs: hooks
    if: needs.hooks.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
  build:
    needs: hooks
    if: needs.hooks.outputs.code == 'true' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-musl}
          - {os: macos-latest, target: aarch64-apple-darwin}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --target ${{ matrix.target }}
